<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Know-Do Graph Debugger</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #toolbar h1 { font-size: 15px; font-weight: 600; color: #58a6ff; white-space: nowrap; }
    #toolbar input[type=search] {
      flex: 1; min-width: 160px; max-width: 320px;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 5px 10px; font-size: 13px;
    }
    #toolbar input[type=search]:focus { outline: none; border-color: #58a6ff; }
    #toolbar select {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 5px 8px; font-size: 13px;
    }
    #toolbar button {
      background: #21262d; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 5px 12px; font-size: 13px; cursor: pointer;
    }
    #toolbar button:hover { background: #30363d; }
    #stats { font-size: 12px; color: #8b949e; margin-left: auto; white-space: nowrap; }

    /* ── Main area ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SVG canvas ── */
    #canvas {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    svg {
      width: 100%; height: 100%;
      cursor: grab;
    }
    svg:active { cursor: grabbing; }

    /* ── Arrows / edges ── */
    .edge {
      stroke-opacity: 0.55;
      stroke-width: 1.5;
    }
    .edge.highlighted { stroke-opacity: 1; stroke-width: 2.5; }

    /* ── Nodes ── */
    .node circle {
      stroke-width: 2;
      transition: r 0.15s, stroke-opacity 0.15s;
    }
    .node circle:hover { cursor: pointer; }
    .node.dimmed circle { opacity: 0.18; }
    .node.dimmed text { opacity: 0.18; }
    .node text {
      font-size: 11px; fill: #c9d1d9;
      pointer-events: none;
      dominant-baseline: central;
    }

    /* ── Edge labels ── */
    .edge-label {
      font-size: 9px; fill: #8b949e;
      pointer-events: none;
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 280px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-title { font-weight: 600; font-size: 13px; color: #58a6ff; margin-bottom: 6px; }
    #tooltip .tt-row { display: flex; gap: 6px; margin-top: 3px; }
    #tooltip .tt-key { color: #8b949e; flex-shrink: 0; }
    #tooltip .tt-val { color: #e6edf3; word-break: break-all; }
    #tooltip .tt-tags span {
      background: #21262d; border: 1px solid #30363d; border-radius: 12px;
      padding: 1px 7px; font-size: 11px; margin: 2px 2px 0 0; display: inline-block;
    }

    /* ── Detail panel ── */
    #detail {
      width: 360px;
      background: #161b22;
      border-left: 1px solid #30363d;
      overflow-y: auto;
      flex-shrink: 0;
      transition: width 0.2s;
      display: flex;
      flex-direction: column;
    }
    #detail.hidden { width: 0; border-left: none; overflow: hidden; }

    #detail-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    #detail-header h2 { font-size: 14px; font-weight: 600; color: #58a6ff; }
    #detail-close {
      background: none; border: none; color: #8b949e; font-size: 18px;
      cursor: pointer; line-height: 1;
    }
    #detail-close:hover { color: #e6edf3; }

    #detail-body { padding: 14px 16px; flex: 1; }

    .detail-section { margin-bottom: 18px; }
    .detail-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      color: #8b949e; letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .detail-kv { display: flex; gap: 8px; margin-bottom: 5px; font-size: 12px; align-items: flex-start; }
    .detail-kv .k { color: #8b949e; min-width: 120px; flex-shrink: 0; }
    .detail-kv .v { color: #e6edf3; word-break: break-all; }

    .tag-pill {
      background: #21262d; border: 1px solid #30363d; border-radius: 12px;
      padding: 2px 9px; font-size: 11px; margin: 2px 2px 0 0; display: inline-block;
      color: #c9d1d9;
    }

    .content-block {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 10px 12px; font-size: 12px; line-height: 1.6;
      color: #c9d1d9; white-space: pre-wrap; max-height: 260px; overflow-y: auto;
    }

    .edge-list-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 0; border-bottom: 1px solid #21262d; font-size: 12px;
    }
    .edge-list-item:last-child { border-bottom: none; }
    .rel-badge {
      background: #21262d; border: 1px solid #30363d; border-radius: 4px;
      padding: 1px 6px; font-size: 10px; color: #79c0ff; white-space: nowrap;
    }
    .node-link {
      color: #58a6ff; cursor: pointer; text-decoration: underline dotted;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .node-link:hover { color: #79c0ff; }
    .dir-badge { font-size: 10px; color: #8b949e; }

    /* ── Entry type colours ── */
    :root {
      --c-capability:   #238636;
      --c-procedure:    #1f6feb;
      --c-workflow:     #9e6a03;
      --c-tool:         #6e40c9;
      --c-repository:   #bf8700;
      --c-environment:  #1a7f5a;
      --c-dependency:   #cf222e;
      --c-data:         #0550ae;
      --c-analytical:   #8250df;
      --c-memory:       #6e7781;
      --c-generic:      #30363d;
    }

    /* Legend */
    #legend {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 14px; font-size: 11px;
    }
    #legend .leg-title { font-weight: 600; color: #8b949e; margin-bottom: 6px; }
    .leg-item { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 14px; color: #8b949e;
      background: #0d1117; z-index: 10;
    }
    #loading.hidden { display: none; }

    /* Error */
    #error-banner {
      display: none; background: #3d0b0b; border-bottom: 1px solid #cf222e;
      color: #ffa198; padding: 8px 16px; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>

<div id="error-banner"></div>

<div id="toolbar">
  <h1>Know-Do Graph</h1>
  <input type="search" id="search-input" placeholder="Search nodes…" />
  <select id="type-filter">
    <option value="">All types</option>
    <option value="capability">capability</option>
    <option value="procedure">procedure</option>
    <option value="workflow">workflow</option>
    <option value="tool">tool</option>
    <option value="repository">repository</option>
    <option value="environment">environment</option>
    <option value="dependency">dependency</option>
    <option value="data">data</option>
    <option value="analytical">analytical</option>
    <option value="memory">memory</option>
    <option value="generic">generic</option>
  </select>
  <button id="reset-view">Reset view</button>
  <button id="toggle-labels">Labels: on</button>
  <span id="stats">Loading…</span>
</div>

<div id="main">
  <div id="canvas">
    <div id="loading">Loading graph…</div>
    <svg id="graph-svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="18" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#444c56" />
        </marker>
        <marker id="arrow-hl" markerWidth="8" markerHeight="8" refX="18" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff" />
        </marker>
      </defs>
      <g id="scene"></g>
    </svg>
    <div id="legend">
      <div class="leg-title">Entry types</div>
    </div>
  </div>

  <div id="detail" class="hidden">
    <div id="detail-header">
      <h2 id="detail-title">Node Detail</h2>
      <button id="detail-close">×</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<div id="tooltip"></div>

<script>
const API = window.location.origin;

const TYPE_COLORS = {
  capability:   '#238636',
  procedure:    '#1f6feb',
  workflow:     '#d29922',
  tool:         '#8957e5',
  repository:   '#bf8700',
  environment:  '#1a7f5a',
  dependency:   '#cf222e',
  data:         '#388bfd',
  analytical:   '#a371f7',
  memory:       '#6e7781',
  generic:      '#444c56',
};

// ── Build legend ──────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
Object.entries(TYPE_COLORS).forEach(([type, color]) => {
  const item = document.createElement('div');
  item.className = 'leg-item';
  item.innerHTML = `<div class="leg-dot" style="background:${color}"></div>${type}`;
  legend.appendChild(item);
});

// ── State ─────────────────────────────────────────────────────────────────────
let allNodes = [], allEdges = [];
let simulation, svgSel, sceneSel, zoom;
let showLabels = true;
let selectedId = null;

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(event, node) {
  const md = node.metadata || {};
  let html = `<div class="tt-title">${escHtml(node.title)}</div>`;
  html += `<div class="tt-row"><span class="tt-key">type</span><span class="tt-val">${node.entry_type || '—'}</span></div>`;
  html += `<div class="tt-row"><span class="tt-key">slug</span><span class="tt-val">${node.slug || '—'}</span></div>`;
  if (md.refinement_status) html += `<div class="tt-row"><span class="tt-key">status</span><span class="tt-val">${md.refinement_status}</span></div>`;
  if (md.trust_score != null) html += `<div class="tt-row"><span class="tt-key">trust</span><span class="tt-val">${md.trust_score}</span></div>`;
  if (md.usage_count != null) html += `<div class="tt-row"><span class="tt-key">usage</span><span class="tt-val">${md.usage_count}</span></div>`;
  if (node.tags && node.tags.length) {
    html += `<div class="tt-row"><span class="tt-key">tags</span><span class="tt-val tt-tags">${node.tags.map(t => `<span>${escHtml(t)}</span>`).join('')}</span></div>`;
  }
  tooltip.innerHTML = html;
  moveTooltip(event);
  tooltip.classList.add('visible');
}
function moveTooltip(event) {
  const pad = 12;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + tw > window.innerWidth) x = event.clientX - tw - pad;
  if (y + th > window.innerHeight) y = event.clientY - th - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// ── Detail panel ──────────────────────────────────────────────────────────────
async function openDetail(nodeId) {
  selectedId = nodeId;
  // Fetch full entry from API
  let entry;
  try {
    const r = await fetch(`${API}/entries/${nodeId}`);
    if (!r.ok) throw new Error(r.statusText);
    entry = await r.json();
  } catch {
    // fallback to in-memory graph node
    entry = allNodes.find(n => n.id === nodeId);
  }

  const panel = document.getElementById('detail');
  const body  = document.getElementById('detail-body');
  document.getElementById('detail-title').textContent = entry.title || nodeId;

  const md = entry.metadata || {};
  let html = '';

  // Identity section
  html += section('Identity', [
    kv('ID', entry.id),
    kv('Slug', entry.slug),
    kv('Type', entry.entry_type),
  ]);

  // Content
  if (entry.content) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Content</div>
      <div class="content-block">${escHtml(entry.content)}</div>
    </div>`;
  }

  // Tags
  if (entry.tags && entry.tags.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Tags</div>
      <div>${entry.tags.map(t => `<span class="tag-pill">${escHtml(t)}</span>`).join('')}</div>
    </div>`;
  }

  // Metadata
  const mdRows = [
    kv('Refinement status', md.refinement_status),
    kv('Trust score', md.trust_score),
    kv('Usage count', md.usage_count),
    kv('Source provenance', md.source_provenance),
    kv('Extraction method', md.extraction_method),
    kv('Verification', md.verification_status),
  ].filter(Boolean);
  if (mdRows.length) html += section('Metadata', mdRows);

  // Script section — shown for any entry with script_language in metadata
  if (md.script_language) {
    const lang = md.script_language || 'unknown';
    const reqs = (md.script_requirements && md.script_requirements.length)
      ? md.script_requirements.join(', ') : '—';
    const fname = md.script_filename || entry.slug + '.txt';
    const dlUrl = `${API}/entries/${entry.id}/download`;
    html += `<div class="detail-section">
      <div class="detail-section-title">Script</div>
      ${kv('Language', lang)}
      ${kv('Requirements', reqs)}
      ${kv('Filename', fname)}
      <div style="margin-top:8px">
        <a href="${escAttr(dlUrl)}" download="${escAttr(fname)}"
           style="display:inline-block;background:#e36209;color:#fff;border-radius:6px;
                  padding:5px 14px;font-size:12px;text-decoration:none;font-weight:600;">
          ⬇ Download ${escHtml(fname)}
        </a>
      </div>
    </div>`;
  }

  if (md.related_environments && md.related_environments.length)
    html += section('Related environments', [kv('', md.related_environments.join(', '))]);
  if (md.runtime_requirements && md.runtime_requirements.length)
    html += section('Runtime requirements', [kv('', md.runtime_requirements.join(', '))]);
  if (md.external_refs && md.external_refs.length)
    html += section('External refs', [kv('', md.external_refs.join(', '))]);

  // Internal refs (wikilinks)
  if (entry.internal_refs && entry.internal_refs.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Wikilinks (${entry.internal_refs.length})</div>
      ${entry.internal_refs.map(r => `<div class="edge-list-item"><span class="node-link" onclick="focusNodeBySlug('${escAttr(r)}')">${escHtml(r)}</span></div>`).join('')}
    </div>`;
  }

  // Edges from graph
  const outEdges = allEdges.filter(e => e.source.id === nodeId || e.source === nodeId);
  const inEdges  = allEdges.filter(e => e.target.id === nodeId || e.target === nodeId);
  if (outEdges.length || inEdges.length) {
    html += `<div class="detail-section"><div class="detail-section-title">Connections</div>`;
    outEdges.forEach(e => {
      const tid = e.target.id || e.target;
      const tnode = allNodes.find(n => n.id === tid);
      html += `<div class="edge-list-item">
        <span class="dir-badge">→</span>
        <span class="rel-badge">${escHtml(e.relation || 'link')}</span>
        <span class="node-link" onclick="focusNode('${escAttr(tid)}')">${escHtml(tnode ? tnode.title : tid)}</span>
      </div>`;
    });
    inEdges.forEach(e => {
      const sid = e.source.id || e.source;
      const snode = allNodes.find(n => n.id === sid);
      html += `<div class="edge-list-item">
        <span class="dir-badge">←</span>
        <span class="rel-badge">${escHtml(e.relation || 'link')}</span>
        <span class="node-link" onclick="focusNode('${escAttr(sid)}')">${escHtml(snode ? snode.title : sid)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Custom metadata
  if (md.custom && Object.keys(md.custom).length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Custom metadata</div>
      <pre class="content-block">${escHtml(JSON.stringify(md.custom, null, 2))}</pre>
    </div>`;
  }

  body.innerHTML = html;
  panel.classList.remove('hidden');

  // Highlight connected nodes
  highlightNode(nodeId);
}

function closeDetail() {
  document.getElementById('detail').classList.add('hidden');
  selectedId = null;
  clearHighlight();
}

function kv(key, val) {
  if (val == null || val === '') return '';
  return `<div class="detail-kv"><span class="k">${escHtml(key)}</span><span class="v">${escHtml(String(val))}</span></div>`;
}
function section(title, rows) {
  const content = rows.filter(Boolean).join('');
  if (!content) return '';
  return `<div class="detail-section"><div class="detail-section-title">${title}</div>${content}</div>`;
}

// ── Highlight logic ────────────────────────────────────────────────────────────
function highlightNode(nodeId) {
  if (!sceneSel) return;
  const connectedIds = new Set([nodeId]);
  allEdges.forEach(e => {
    const s = e.source.id || e.source, t = e.target.id || e.target;
    if (s === nodeId) connectedIds.add(t);
    if (t === nodeId) connectedIds.add(s);
  });

  sceneSel.selectAll('.node')
    .classed('dimmed', d => !connectedIds.has(d.id));

  sceneSel.selectAll('.edge')
    .classed('highlighted', e => {
      const s = e.source.id || e.source, t = e.target.id || e.target;
      return s === nodeId || t === nodeId;
    })
    .attr('stroke', e => {
      const s = e.source.id || e.source, t = e.target.id || e.target;
      return (s === nodeId || t === nodeId) ? '#58a6ff' : '#444c56';
    })
    .attr('marker-end', e => {
      const s = e.source.id || e.source, t = e.target.id || e.target;
      return (s === nodeId || t === nodeId) ? 'url(#arrow-hl)' : 'url(#arrow)';
    });
}

function clearHighlight() {
  if (!sceneSel) return;
  sceneSel.selectAll('.node').classed('dimmed', false);
  sceneSel.selectAll('.edge')
    .classed('highlighted', false)
    .attr('stroke', '#444c56')
    .attr('marker-end', 'url(#arrow)');
}

// ── Focus helpers ──────────────────────────────────────────────────────────────
window.focusNode = function(id) { openDetail(id); };
window.focusNodeBySlug = function(slug) {
  const n = allNodes.find(n => n.slug === slug);
  if (n) openDetail(n.id);
};

// ── D3 graph render ────────────────────────────────────────────────────────────
function render(nodes, edges) {
  allNodes = nodes;
  allEdges = edges;

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('stats').textContent =
    `${nodes.length} nodes · ${edges.length} edges`;

  const svgEl = document.getElementById('graph-svg');
  svgSel = d3.select(svgEl);
  sceneSel = svgSel.select('#scene');
  sceneSel.selectAll('*').remove();

  zoom = d3.zoom()
    .scaleExtent([0.05, 5])
    .on('zoom', e => sceneSel.attr('transform', e.transform));
  svgSel.call(zoom);

  // Node radius by degree
  const degreeMap = {};
  nodes.forEach(n => { degreeMap[n.id] = 0; });
  edges.forEach(e => {
    const s = e.source, t = e.target;
    degreeMap[s] = (degreeMap[s] || 0) + 1;
    degreeMap[t] = (degreeMap[t] || 0) + 1;
  });
  const rScale = d3.scaleSqrt()
    .domain([0, d3.max(Object.values(degreeMap)) || 1])
    .range([7, 22]);

  // Edges
  const edgeSel = sceneSel.append('g').attr('class', 'edges')
    .selectAll('.edge')
    .data(edges)
    .enter().append('line')
      .attr('class', 'edge')
      .attr('stroke', '#444c56')
      .attr('marker-end', 'url(#arrow)');

  // Edge labels
  const edgeLabelSel = sceneSel.append('g').attr('class', 'edge-labels')
    .selectAll('.edge-label')
    .data(edges)
    .enter().append('text')
      .attr('class', 'edge-label')
      .text(d => d.relation || '');

  // Node groups
  const nodeSel = sceneSel.append('g').attr('class', 'nodes')
    .selectAll('.node')
    .data(nodes, d => d.id)
    .enter().append('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', dragStart)
        .on('drag',  dragging)
        .on('end',   dragEnd));

  nodeSel.append('circle')
    .attr('r', d => rScale(degreeMap[d.id] || 0))
    .attr('fill', d => TYPE_COLORS[d.entry_type] || TYPE_COLORS.generic)
    .attr('stroke', d => d3.color(TYPE_COLORS[d.entry_type] || TYPE_COLORS.generic).brighter(1))
    .on('mouseover', (event, d) => showTooltip(event, d))
    .on('mousemove', (event)    => moveTooltip(event))
    .on('mouseout',  ()         => hideTooltip())
    .on('click',     (event, d) => { event.stopPropagation(); openDetail(d.id); });

  nodeSel.append('text')
    .attr('x', d => rScale(degreeMap[d.id] || 0) + 4)
    .text(d => d.title)
    .style('display', showLabels ? null : 'none');

  // Click on background clears selection
  svgSel.on('click', () => { hideTooltip(); closeDetail(); });

  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force('link',   d3.forceLink(edges).id(d => d.id).distance(90))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('center', d3.forceCenter(svgEl.clientWidth / 2, svgEl.clientHeight / 2))
    .force('collide', d3.forceCollide(d => rScale(degreeMap[d.id] || 0) + 8))
    .on('tick', () => {
      edgeSel
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);

      edgeLabelSel
        .attr('x', d => (d.source.x + d.target.x) / 2)
        .attr('y', d => (d.source.y + d.target.y) / 2);

      nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    });
}

function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── Toolbar controls ───────────────────────────────────────────────────────────
document.getElementById('reset-view').addEventListener('click', () => {
  const svgEl = document.getElementById('graph-svg');
  svgSel.transition().duration(400).call(
    zoom.transform,
    d3.zoomIdentity.translate(svgEl.clientWidth / 2, svgEl.clientHeight / 2).scale(1)
      .translate(-svgEl.clientWidth / 2, -svgEl.clientHeight / 2)
  );
});

document.getElementById('toggle-labels').addEventListener('click', function() {
  showLabels = !showLabels;
  this.textContent = `Labels: ${showLabels ? 'on' : 'off'}`;
  if (sceneSel) sceneSel.selectAll('.node text').style('display', showLabels ? null : 'none');
});

document.getElementById('detail-close').addEventListener('click', closeDetail);

// Search
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  applyFilters(q, document.getElementById('type-filter').value);
});
document.getElementById('type-filter').addEventListener('change', function() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  applyFilters(q, this.value);
});

function applyFilters(q, type) {
  if (!sceneSel) return;
  sceneSel.selectAll('.node').style('display', d => {
    const matchQ    = !q    || d.title.toLowerCase().includes(q) || (d.slug || '').includes(q);
    const matchType = !type || d.entry_type === type;
    return (matchQ && matchType) ? null : 'none';
  });
  sceneSel.selectAll('.edge').style('display', e => {
    const si = allNodes.find(n => n.id === (e.source.id || e.source));
    const ti = allNodes.find(n => n.id === (e.target.id || e.target));
    if (!si || !ti) return 'none';
    const matchQ    = !q    || si.title.toLowerCase().includes(q) || ti.title.toLowerCase().includes(q);
    const matchType = !type || si.entry_type === type || ti.entry_type === type;
    return (matchQ && matchType) ? null : 'none';
  });
}

// ── Utilities ──────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s ?? '').replace(/'/g, "\\'");
}

// ── Fetch & boot ──────────────────────────────────────────────────────────────
async function loadGraph() {
  try {
    const r = await fetch(`${API}/graph/full`);
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
    const data = await r.json();
    render(data.nodes, data.edges);
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    const banner = document.getElementById('error-banner');
    banner.textContent = `Failed to load graph: ${err.message}. Make sure the API server is running at ${API}.`;
    banner.style.display = 'block';
  }
}

loadGraph();
</script>
</body>
</html>
