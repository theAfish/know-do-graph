[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "know-do-graph"
dynamic = ["version"]
description = "A wiki-native, agent-oriented infrastructure for executable knowledge, operational memory, and capability discovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "typer>=0.24.1",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.25",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
local-embeddings = ["sentence-transformers>=2.7"]

[project.scripts]
know-do-graph = "main:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "core", "examples", "know_do_graph"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"assets/starter.db" = "core/resources/starter.db"
"frontend/dist" = "frontend/dist"

[tool.hatch.build.targets.sdist.force-include]
"assets/starter.db" = "assets/starter.db"
"frontend/dist" = "frontend/dist"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
